<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSQL Workbench</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
    <header class="page-header">
        <div>
            <h1>MiniSQL Workbench</h1>
            <p class="subtitle">Run SQL and inspect the result.</p>
        </div>
    </header>

    <section class="workspace">
        <div class="panel editor-panel">
            <div class="panel-header">
                <div>
                    <p class="panel-label">Editor</p>
                    <h2>SQL</h2>
                </div>
                <div class="panel-actions">
                    <button id="runButton" class="primary" type="button">Run</button>
                    <button id="resetButton" class="secondary" type="button">Reload Catalog</button>
                </div>
            </div>
            <label class="editor-frame" for="sqlInput">
                <span class="editor-title">query.sql</span>
                <textarea id="sqlInput" spellcheck="false">SELECT * FROM student;</textarea>
            </label>
        </div>

        <div class="panel output-panel">
            <div class="panel-header">
                <div>
                    <p class="panel-label">Output</p>
                    <h2>Result</h2>
                </div>
                <span id="statusBadge" class="status-badge idle">Idle</span>
            </div>
            <div id="outputArea" class="output-body muted">
                <div class="empty-state">
                    <h3>No result yet</h3>
                    <p>Run a query to see output.</p>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
