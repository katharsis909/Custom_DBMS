<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSQL Workbench</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
    <header class="page-header">
        <div>
            <h1>MiniSQL Workbench</h1>
            <p class="subtitle">Write SQL on the left. Results and errors appear on the right.</p>
        </div>
        <div class="quick-notes">
            <span class="note-chip">`SELECT` tables render as HTML tables</span>
            <span class="note-chip">Errors are highlighted in red</span>
        </div>
    </header>

    <section class="workspace">
        <div class="panel editor-panel">
            <div class="panel-header">
                <div>
                    <p class="panel-label">Query Editor</p>
                    <h2>SQL Input</h2>
                </div>
                <div class="panel-actions">
                    <button id="runButton" class="primary" type="button">Run Query</button>
                    <button id="resetButton" class="secondary" type="button">Reset Catalog</button>
                </div>
            </div>
            <label class="editor-frame" for="sqlInput">
                <span class="editor-title">query.sql</span>
                <textarea id="sqlInput" spellcheck="false">CREATE TABLE student (name STRING, age INT, marks INT);
INSERT INTO student ('aryan', 54, 78);
INSERT INTO student ('aryan', 54, 85);
SELECT * FROM student;</textarea>
            </label>
        </div>

        <div class="panel output-panel">
            <div class="panel-header">
                <div>
                    <p class="panel-label">Results</p>
                    <h2>Execution Output</h2>
                </div>
                <span id="statusBadge" class="status-badge idle">Idle</span>
            </div>
            <div id="outputArea" class="output-body muted">
                <div class="empty-state">
                    <h3>No result yet</h3>
                    <p>Run a statement to view text output, errors, or rendered table results.</p>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
